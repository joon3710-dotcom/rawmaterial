<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>원자재 가격 동향 대시보드</title>
<style>
.viz-root{color-scheme:light;--surface-0:#f4f4f2;--surface-1:#fcfcfb;--border:#e2e1dc;--grid:#ecebe7;--chip:#efeee9;
 --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7974;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--up:#c62f2f;--down:#1f62b8}

*{box-sizing:border-box}
html,body{background:#f4f4f2;color-scheme:light}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.viz-root{background:var(--surface-0);color:var(--text-primary);min-height:100vh;padding:22px 28px 40px}
/* 1. 안내 영역 */
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}
.meta{font-size:13px;color:var(--text-secondary);display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--text-primary)}
.guide{margin:10px 0 14px;padding:9px 12px;border:1px dashed var(--border);border-radius:8px;font-size:12.5px;color:var(--text-secondary);display:flex;gap:18px;flex-wrap:wrap}
.guide span b{color:var(--text-primary)}
/* 2. 상단 메뉴 */
.bar{position:sticky;top:0;z-index:5;background:var(--surface-0);padding:8px 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp .lbl{font-size:12px;color:var(--text-muted);margin-right:2px}
.tab{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
.tab.on{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.rng{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.rng.on{background:var(--chip);color:var(--text-primary);border-color:var(--text-secondary);font-weight:700}
.panel{display:none}.panel.on{display:block}
/* 섹션 헤더 */
.sh{margin:0 0 12px}
.sh h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sh h2 .no{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--text-primary);color:var(--surface-1);font-size:13px;align-items:center;justify-content:center}
.sh .desc{font-size:13px;color:var(--text-secondary)}
.sh .src{font-size:12px;color:var(--text-muted);margin-top:2px}
.sh .src a{color:var(--text-muted)}
/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer}
.kc:hover{border-color:var(--text-secondary)}
.kc .g{font-size:11.5px;color:var(--text-muted)}
.kc .n{font-size:13px;font-weight:600;margin:2px 0 6px}
.kc .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kc .u{display:block;font-size:12px;color:var(--text-secondary);font-weight:400;margin-top:1px}
.kc .c{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.kc .d{font-size:11.5px;color:var(--text-muted)}
.kc .stale{font-size:11.5px;color:var(--s2);font-weight:600;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px 8px;position:relative;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-size:14.5px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.unit{font-size:12px;font-weight:600;color:var(--text-secondary);background:var(--chip);padding:2px 8px;border-radius:10px;white-space:nowrap}
.kpi{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 4px;font-size:12.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.kpi .it{display:flex;align-items:baseline;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;align-self:center}
.kpi b{font-size:18px;color:var(--text-primary)}
.leg{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);margin:2px 0 0}
.leg i{display:inline-block;vertical-align:middle;margin-right:5px}
/* 비철금속 행 */
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch}
.mlab{background:var(--chip);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;gap:2px}
.mlab small{font-size:11px;color:var(--text-muted);font-weight:400}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--text-muted)}
svg text{font-size:11px;fill:var(--text-muted);font-variant-numeric:tabular-nums}
svg text.ax{fill:var(--text-secondary);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:3}
.tip b{display:block;margin-bottom:4px}
/* 요약표 */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
th{color:var(--text-secondary);font-weight:600;background:var(--surface-1)}
tr.gh td{background:var(--chip);font-weight:700;color:var(--text-primary);border-top:2px solid var(--border);cursor:pointer}
tr.gh td .go{font-weight:400;font-size:11.5px;color:var(--text-muted);margin-left:8px}
tr.it td:first-child{padding-left:20px}
tr.it:hover td{background:var(--grid);cursor:pointer}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--border);color:var(--text-secondary)}
.tag.stock{background:var(--chip)}
tr.stock td:first-child{color:var(--text-secondary)}
.sum{overflow:auto}
.note{font-size:12px;color:var(--text-muted);margin-top:8px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}}
</style></head>

function tabs(){const T=document.getElementById('tabs');T.innerHTML=[['summary','전체 요약'],...SECTIONS.map(s=>[s.id,s.nav])].map(([id,l])=>`<button class="tab ${id===tab?'on':''}" data-t="${id}">${l}</button>`).join('');
 T.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function ranges(){const R=document.getElementById('ranges');R.innerHTML='<span class="lbl">조회기간</span>'+RANGES.map(([l,v])=>`<button class="rng ${String(v)===String(range)?'on':''}" data-v="${v}">${l}</button>`).join('');
 R.querySelectorAll('.rng').forEach(b=>b.onclick=()=>{const v=b.dataset.v;range=isNaN(v)?v:+v;ranges();draw()})}
function draw(){const p=document.querySelector(`.panel[data-p="${tab}"]`);if(!p)return;p.querySelectorAll('.ch').forEach(el=>chart(el,el.dataset.k.split(','),el.dataset.u));p.querySelectorAll('.ch2').forEach(el=>chart2(el,el.dataset.p,el.dataset.s))}
function go(id){tab=id;store.set('rm_tab',id);document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===id));tabs();draw();window.scrollTo({top:0})}
document.getElementById('asof').textContent=latestAll;
build();tabs();ranges();go(tab);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150)});
</script></body></html>
